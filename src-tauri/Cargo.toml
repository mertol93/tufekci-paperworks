[package]
name = "tufekci-paperworks"
version = "0.1.0-alpha.1"
description = "A local-first cross-platform document and PDF workbench"
authors = ["Tüfekci Paperworks Contributors"]
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "tufekci_paperworks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
argon2 = "0.5.3"
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "pnm", "tiff", "webp"] }
lopdf = { version = "0.44.0", default-features = false }
minisign-verify = "0.2.5"
quick-xml = "0.41.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
skrifa = { version = "0.45.1", default-features = false, features = ["std"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-wdio = { version = "1.2.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.2.0", optional = true }
url = "2"
zeroize = "1.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-updater = "2.10.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
